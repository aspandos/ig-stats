name: Update Instagram stats

on:
  schedule:
    # Hourly, at :17 to stay clear of the top-of-the-hour queue.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ig-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Read the follower count
        run: node update.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}

      - name: Commit the new numbers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add stats.json history.json
          git diff --cached --quiet || { git commit -m "Update Instagram stats" && git push; }
