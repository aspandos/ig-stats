name: Update Instagram stats

on:
  schedule:
    # Hourly, at :17 to stay clear of the top-of-the-hour queue.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ig-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # v7.0.1, pinned by commit. `ref: main` so a run that waited in the queue starts from the latest commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - name: Read the follower count
        run: node update.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}

      - name: Commit the new numbers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add stats.json history.json
          git diff --cached --quiet || { git commit -q -m "Update Instagram stats" && git pull -q --rebase origin main && git push -q; }
